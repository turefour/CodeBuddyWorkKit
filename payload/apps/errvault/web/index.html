<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>CodeBuddy 报错库 · errvault</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0e141b;
    --panel: #151d26;
    --panel2: #1a2431;
    --line: #24313f;
    --text: #d6e2ee;
    --dim: #8ba0b6;
    --faint: #647a90;
    --accent: #4ea1d3;
    --ok: #4caf7d;
    --warn: #e0a33e;
    --err: #d9534f;
    --purple: #9b7fd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,20,27,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
  }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  h1 small { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .stats { display: flex; gap: 10px; margin-left: auto; color: var(--dim); font-size: 12px; }
  .stats b { color: var(--text); font-weight: 600; }
  .searchbar { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=search], input[type=text], select, textarea {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font: inherit; outline: none;
  }
  input[type=search]:focus, input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); }
  #q { flex: 1; min-width: 240px; }
  button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 7px 13px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #2b6a94; border-color: #2b6a94; }
  main { padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }
  .hint { color: var(--faint); font-size: 12px; margin-bottom: 14px; }
  .empty { color: var(--faint); text-align: center; padding: 60px 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px; cursor: pointer; transition: border-color .15s;
  }
  .card:hover { border-color: #2f4055; }
  .card.open { border-color: var(--accent); }
  .card-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid;
    white-space: nowrap;
  }
  .badge.error { color: var(--err); border-color: #5a2a29; background: #2a1717; }
  .badge.hang { color: var(--warn); border-color: #5c4520; background: #2a2113; }
  .badge.blocked { color: var(--purple); border-color: #40335c; background: #221b30; }
  .badge.tool-fail { color: var(--accent); border-color: #234459; background: #152530; }
  .badge.other { color: var(--dim); border-color: var(--line); background: var(--panel2); }
  .badge.resolved { color: var(--ok); border-color: #24503a; background: #14251c; }
  .badge.unresolved { color: var(--warn); border-color: #5c4520; background: #2a2113; }
  .time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tool { color: var(--accent); font-size: 12px; font-family: Consolas, monospace; }
  .symptom { margin-top: 6px; color: var(--text); word-break: break-word; }
  .meta { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .meta span b { color: var(--faint); font-weight: 400; margin-right: 4px; }
  .body { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; display: none; }
  .card.open .body { display: block; }
  .field { margin-bottom: 10px; }
  .field .label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
  .field .val { white-space: pre-wrap; word-break: break-word; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 11px; color: var(--dim); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; }
  pre {
    background: #0b1117; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; overflow: auto; max-height: 420px; margin: 6px 0 0;
    font: 12px/1.5 Consolas, "Cascadia Mono", monospace; color: #b8c9d9;
  }
  .snip-name { color: var(--dim); font-size: 12px; margin-top: 10px; font-family: Consolas, monospace; }

  /* 新增维度的徽章 */
  .badge.scope { color: #7fb3d5; border-color: #23404f; background: #14232b; }
  .badge.repro-always { color: #e06c75; border-color: #5a2a29; background: #2a1717; }
  .badge.repro-often { color: var(--warn); border-color: #5c4520; background: #2a2113; }
  .badge.repro-sometimes { color: #7fb3d5; border-color: #23404f; background: #14232b; }
  .badge.repro-rare { color: var(--dim); border-color: var(--line); background: var(--panel2); }
  .badge.sev-blocker { color: #fff; background: #8b2f2c; border-color: #8b2f2c; }
  .badge.sev-major { color: var(--warn); border-color: #5c4520; background: #2a2113; }
  .badge.sev-minor { color: var(--ok); border-color: #24503a; background: #14251c; }
  .badge.count { color: #d6a35b; border-color: #4d3a1f; background: #241c10; font-weight: 600; }

  /* 日志面板 */
  #logs {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .72); display: none;
    align-items: center; justify-content: center; z-index: 60; padding: 24px;
  }
  #logs.show { display: flex; }
  .logbox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    width: 1020px; max-width: 100%; max-height: 84vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .logbox header {
    position: static; backdrop-filter: none; border-bottom: 1px solid var(--line);
    padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .logbox header h2 { font-size: 13px; margin: 0; font-weight: 600; }
  .logbox header .meta { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .logbox pre {
    margin: 0; border: 0; border-radius: 0; max-height: none; flex: 1;
    overflow: auto; background: #0b1117; padding: 12px 14px;
  }
  /* 弹窗 */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #modal.show { display: flex; }
  .dialog {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    width: 640px; max-width: 100%; max-height: 90vh; overflow: auto; padding: 18px 20px;
  }
  .dialog h2 { font-size: 14px; margin: 0 0 14px; font-weight: 600; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  .row label { display: block; color: var(--faint); font-size: 11px; margin-bottom: 3px; }
  .row input, .row select, .row textarea { width: 100%; }
  textarea { resize: vertical; min-height: 58px; font-family: inherit; }
  .dialog .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>CodeBuddy 报错库 <small>errvault · 先查库，再动手</small></h1>
    <div class="stats" id="stats"></div>
    <button id="btnAdd">＋ 记录一条</button>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="搜索报错原文 / 工具名 / 现象描述…（支持中文，如「权限 拒绝」）" />
    <select id="fKind" class="filt">
      <option value="">全部类型</option>
      <option value="error">error 报错</option>
      <option value="hang">hang 卡死</option>
      <option value="blocked">blocked 被拦截</option>
      <option value="tool-fail">tool-fail 工具失败</option>
    </select>
    <select id="fScope" class="filt">
      <option value="">全部范围</option>
      <option value="single">单次任务</option>
      <option value="project">单个项目</option>
      <option value="machine">整机 / 环境</option>
      <option value="global">跨项目通用</option>
    </select>
    <select id="fRepro" class="filt">
      <option value="">全部复现率</option>
      <option value="always">必现</option>
      <option value="often">经常 &gt;50%</option>
      <option value="sometimes">偶发 10-50%</option>
      <option value="rare">罕见 &lt;10%</option>
    </select>
    <select id="fSev" class="filt">
      <option value="">全部严重度</option>
      <option value="blocker">阻塞</option>
      <option value="major">严重</option>
      <option value="minor">轻微</option>
    </select>
    <button id="btnSearch">搜索</button>
    <button id="btnLogs">日志</button>
  </div>
</header>

<main>
  <div class="hint" id="hint"></div>
  <div id="list"></div>
</main>

<div id="logs">
  <div class="logbox">
    <header>
      <h2>运行日志</h2>
      <span class="meta" id="logMeta"></span>
      <button id="btnLogRe">刷新</button>
      <button id="btnLogClose">关闭</button>
    </header>
    <pre id="logBody">加载中…</pre>
  </div>
</div>

<div id="modal">
  <div class="dialog">
    <h2>记录一条报错</h2>
    <div class="row">
      <div>
        <label>类型</label>
        <select id="mKind">
          <option value="error">error 报错</option>
          <option value="hang">hang 卡死</option>
          <option value="blocked">blocked 被拦截</option>
          <option value="tool-fail">tool-fail 工具失败</option>
        </select>
      </div>
      <div>
        <label>工具 / 函数</label>
        <input id="mTool" type="text" placeholder="如 Bash / Read / write_to_file" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>影响范围</label>
        <select id="mScope">
          <option value="single">单次任务</option>
          <option value="project" selected>单个项目</option>
          <option value="machine">整机 / 环境</option>
          <option value="global">跨项目通用</option>
        </select>
      </div>
      <div>
        <label>复现概率</label>
        <select id="mRepro">
          <option value="always">必现</option>
          <option value="often">经常 &gt;50%</option>
          <option value="sometimes" selected>偶发 10-50%</option>
          <option value="rare">罕见 &lt;10%</option>
        </select>
      </div>
      <div>
        <label>严重度</label>
        <select id="mSeverity">
          <option value="blocker">阻塞 · 做不下去</option>
          <option value="major" selected>严重 · 大幅拖慢</option>
          <option value="minor">轻微 · 绕一下就行</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>想达成的目的</label>
        <input id="mGoal" type="text" placeholder="如 把 164 个 PDF 移到 E 盘" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>现象 / 报错原文（检索主字段）</label>
        <textarea id="mSymptom" placeholder="Access is denied / 进程卡住无输出 / …"></textarea>
      </div>
    </div>
    <div class="row">
      <div>
        <label>根因</label>
        <textarea id="mCause"></textarea>
      </div>
    </div>
    <div class="row">
      <div>
        <label>正确解决方案</label>
        <textarea id="mFix"></textarea>
      </div>
    </div>
    <div class="row">
      <div>
        <label>标签（逗号分隔）</label>
        <input id="mTags" type="text" placeholder="powershell, encoding, bom" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>相关代码（可选，会落盘到 snippets/）</label>
        <textarea id="mCode" placeholder="最小复现或修复片段"></textarea>
      </div>
      <div style="flex:0 0 140px">
        <label>文件名</label>
        <input id="mCodeName" type="text" value="snippet.txt" />
      </div>
    </div>
    <div class="foot">
      <button id="btnCancel">取消</button>
      <button id="btnSave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const KIND_LABEL = {
  error: 'error 报错',
  hang: 'hang 卡死',
  blocked: 'blocked 被拦截',
  'tool-fail': 'tool-fail 工具失败'
};
const SCOPE_LABEL = { single: '单次任务', project: '单个项目', machine: '整机环境', global: '跨项目' };
const REPRO_LABEL = { always: '必现', often: '经常', sometimes: '偶发', rare: '罕见' };
const SEV_LABEL = { blocker: '阻塞', major: '严重', minor: '轻微' };

let cache = [];

function badge(kind) {
  const cls = ['error', 'hang', 'blocked', 'tool-fail'].includes(kind) ? kind : 'other';
  return '<span class="badge ' + cls + '">' + esc(KIND_LABEL[kind] || kind || '未知') + '</span>';
}

/** 影响范围 / 复现概率 / 严重度 / 出现次数 */
function extraBadges(e) {
  const out = [];
  const sc = e.scope || 'project';
  out.push('<span class="badge scope">' + esc(SCOPE_LABEL[sc] || sc) + '</span>');
  const rp = e.repro || 'sometimes';
  out.push('<span class="badge repro-' + esc(rp) + '">' + esc(REPRO_LABEL[rp] || rp) + '</span>');
  const sv = e.severity || 'major';
  out.push('<span class="badge sev-' + esc(sv) + '">' + esc(SEV_LABEL[sv] || sv) + '</span>');
  const c = e.count || 1;
  if (c > 1) out.push('<span class="badge count">×' + c + '</span>');
  return out.join('');
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const j = await r.json();
    let html =
      '共 <b>' + j.total + '</b> 条 · 累计出现 <b>' + (j.totalCount || j.total) + '</b> 次' +
      ' · 已解决 <b>' + j.resolved + '</b>' +
      (j.unresolved ? ' · <span style="color:var(--warn)">未解决 <b>' + j.unresolved + '</b></span>' : '');
    if (j.topRecur && j.topRecur.length) {
      const tip = j.topRecur.map((x) => x.count + '× ' + x.symptom).join(' / ');
      html += ' · <span style="color:#d6a35b" title="' + esc(tip) + '">反复踩 ' + j.topRecur.length + '</span>';
    }
    $('#stats').innerHTML = html;
  } catch (e) {
    $('#stats').textContent = '';
  }
}

function render(rows, q) {
  const list = $('#list');
  if (!rows.length) {
    list.innerHTML = '<div class="empty">' +
      (q ? '没有匹配的记录。换关键词试试。' : '库里还没有记录。<br>解决完第一个问题后，点右上角「记录一条」。') +
      '</div>';
    return;
  }
  list.innerHTML = rows.map((r, i) => {
    const e = r.entry;
    const code = (e.snippets || []).length
      ? e.snippets.map((s) =>
          '<div class="snip-name">' + esc(s.name) + ' · ' + s.size + ' B</div>' +
          '<pre data-snip="' + esc(e.id) + '" data-name="' + esc(s.name) + '">加载中…</pre>'
        ).join('')
      : '<div class="snip-name" style="color:var(--faint)">（无关联代码）</div>';
    return '' +
      '<div class="card" data-i="' + i + '">' +
        '<div class="card-head">' +
          badge(e.kind) +
          extraBadges(e) +
          '<span class="badge ' + (e.resolved === false ? 'unresolved' : 'resolved') + '">' +
            (e.resolved === false ? '未解决' : '已解决') + '</span>' +
          '<span class="time">' + esc(e.at) + '</span>' +
          (e.tool ? '<span class="tool">' + esc(e.tool) + '</span>' : '') +
          (r.score ? '<span class="time" style="margin-left:auto">匹配 ' + r.score + '</span>' : '') +
        '</div>' +
        '<div class="symptom">' + esc(e.symptom || '(无现象描述)') + '</div>' +
        '<div class="meta">' +
          (e.goal ? '<span><b>目的</b>' + esc(e.goal) + '</span>' : '') +
          (r.hits && r.hits.length ? '<span><b>命中</b>' + esc(r.hits.slice(0, 6).join(', ')) + '</span>' : '') +
        '</div>' +
        '<div class="body">' +
          (e.cause ? '<div class="field"><div class="label">根因</div><div class="val">' + esc(e.cause) + '</div></div>' : '') +
          (e.fix ? '<div class="field"><div class="label">正确做法</div><div class="val">' + esc(e.fix) + '</div></div>' : '') +
          ((e.tags || []).length ? '<div class="tags">' + e.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '') +
          code +
        '</div>' +
      '</div>';
  }).join('');

  // 展开时懒加载代码
  list.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('click', (ev) => {
      if (ev.target.tagName === 'PRE') return;
      card.classList.toggle('open');
      if (card.classList.contains('open')) {
        card.querySelectorAll('pre[data-snip]').forEach(async (pre) => {
          if (pre.dataset.loaded) return;
          pre.dataset.loaded = '1';
          try {
            const r = await fetch('/api/snippet?id=' + encodeURIComponent(pre.dataset.snip) +
                                  '&name=' + encodeURIComponent(pre.dataset.name));
            pre.textContent = (await r.text()).slice(0, 20000);
          } catch (e) { pre.textContent = '(读取失败)'; }
        });
      }
    });
  });
}

let timer = null;

async function doSearch() {
  const q = $('#q').value.trim();
  const params = new URLSearchParams({ limit: '50', q: q });
  const filters = [['kind', '#fKind'], ['scope', '#fScope'], ['repro', '#fRepro'], ['severity', '#fSev']];
  for (const pair of filters) {
    const v = $(pair[1]).value;
    if (v) params.set(pair[0], v);
  }
  const url = '/api/search?' + params.toString();
  try {
    const r = await fetch(url);
    const j = await r.json();
    cache = j.rows || [];
    $('#hint').textContent = q
      ? '关键词「' + q + '」命中 ' + j.count + ' 条（按匹配度排序）'
      : '共 ' + j.count + ' 条（按时间倒序）';
    render(cache, q);
  } catch (e) {
    $('#hint').textContent = '服务未响应：' + e.message;
  }
}

$('#q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(doSearch, 250);
});
document.querySelectorAll('.filt').forEach((el) => el.addEventListener('change', doSearch));
$('#btnSearch').addEventListener('click', doSearch);

// 新增
$('#btnAdd').addEventListener('click', () => $('#modal').classList.add('show'));
$('#btnCancel').addEventListener('click', () => $('#modal').classList.remove('show'));
$('#btnSave').addEventListener('click', async () => {
  const payload = {
    kind: $('#mKind').value,
    tool: $('#mTool').value.trim(),
    goal: $('#mGoal').value.trim(),
    symptom: $('#mSymptom').value.trim(),
    cause: $('#mCause').value.trim(),
    fix: $('#mFix').value.trim(),
    scope: $('#mScope').value,
    repro: $('#mRepro').value,
    severity: $('#mSeverity').value,
    tags: $('#mTags').value.split(',').map((s) => s.trim()).filter(Boolean)
  };
  const code = $('#mCode').value;
  if (code.trim()) {
    payload.snippets = [{ name: $('#mCodeName').value.trim() || 'snippet.txt', code }];
  }
  try {
    const r = await fetch('/api/entry', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '保存失败');
    $('#modal').classList.remove('show');
    ['#mTool', '#mGoal', '#mSymptom', '#mCause', '#mFix', '#mTags', '#mCode'].forEach((s) => { $(s).value = ''; });
    await loadStats();
    await doSearch();
  } catch (e) {
    alert('保存失败：' + e.message);
  }
});

// ---------- 运行日志 ----------
async function loadLogs() {
  const body = $('#logBody');
  body.textContent = '加载中…';
  try {
    const r = await fetch('/api/logs?tail=400');
    const j = await r.json();
    $('#logMeta').textContent =
      j.file + ' · ' + (j.total || 0) + ' 行 · ' + ((j.size || 0) / 1024).toFixed(1) + ' KB';
    body.textContent = (j.lines || []).join('\n') || '(日志为空)';
    body.scrollTop = body.scrollHeight;
  } catch (e) {
    body.textContent = '读取失败：' + e.message;
  }
}

$('#btnLogs').addEventListener('click', () => {
  $('#logs').classList.add('show');
  loadLogs();
});
$('#btnLogRe').addEventListener('click', loadLogs);
$('#btnLogClose').addEventListener('click', () => $('#logs').classList.remove('show'));
$('#logs').addEventListener('click', (ev) => {
